version: '3.8'

services:
  api:
    build:
      context: .
      target: api-runner
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=file:./dev.db
    restart: always

  web:
    build:
      context: .
      target: web-runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    restart: always
